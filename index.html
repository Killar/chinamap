<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>中国旅行打卡地图</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts/map/js/china.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1 class="title">中国旅行打卡地图</h1>
      <div class="stats">
        <div class="stat-item">
          <span class="stat-value" id="visited-count">0</span>
          <span class="stat-label">已打卡</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-item">
          <span class="stat-value" id="total-count">0</span>
          <span class="stat-label">总景点</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-item">
          <span class="stat-value" id="progress-percent">0%</span>
          <span class="stat-label">完成度</span>
        </div>
      </div>
    </header>

    <main class="main-content">
      <div class="map-container">
        <div id="map" class="map"></div>
        <div class="legend">
          <div class="legend-item">
            <span class="legend-dot visited"></span>
            <span>已打卡</span>
          </div>
          <div class="legend-item">
            <span class="legend-dot unvisited"></span>
            <span>未打卡</span>
          </div>
          <div class="legend-item">
            <span class="legend-block unvisited"></span>
            <span>未打卡省</span>
          </div>
          <div class="legend-item">
            <span class="legend-block partial"></span>
            <span>部分打卡</span>
          </div>
          <div class="legend-item">
            <span class="legend-block completed"></span>
            <span>全部打卡</span>
          </div>
        </div>
      </div>

      <aside class="sidebar">
        <div class="sidebar-header">
          <div class="search-container">
            <input type="text" id="search-input" placeholder="搜索景点..." class="search-input">
            <button id="search-clear" class="search-clear" style="display: none;">×</button>
          </div>
          <span class="filter-toggle" id="filter-toggle">显示全部</span>
        </div>
        <div class="scroll-container">
          <ul class="spot-list" id="spot-list"></ul>
        </div>
      </aside>
    </main>

    <div class="toast" id="toast"></div>
    
    <div id="note-modal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h3 id="note-spot-name"></h3>
          <button class="modal-close" onclick="closeNoteModal()">×</button>
        </div>
        <div class="modal-body">
          <textarea id="note-content" placeholder="在这里写下你的旅行日记..."></textarea>
          <div class="photos-section">
            <h4>照片</h4>
            <div id="photos-preview"></div>
            <input type="file" id="photo-upload" accept="image/*" multiple style="display: none;">
            <button class="upload-btn" onclick="document.getElementById('photo-upload').click()">上传照片</button>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn-cancel" onclick="closeNoteModal()">取消</button>
          <button class="btn-save" onclick="saveNote()">保存笔记</button>
        </div>
      </div>
    </div>

    <!-- 图片预览模态框 -->
    <div id="image-preview-modal" class="image-preview-modal">
      <button class="image-preview-close" onclick="closeImagePreview()">×</button>
      <button class="image-preview-nav prev" onclick="prevImage()">‹</button>
      <div class="image-preview-container">
        <img id="preview-image" src="" alt="预览图片">
      </div>
      <button class="image-preview-nav next" onclick="nextImage()">›</button>
      <div class="image-preview-info">
        <span id="image-counter">1 / 1</span>
        <span class="image-zoom-hint">滚轮缩放 | 拖拽移动</span>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
